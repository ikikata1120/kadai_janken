<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
<title>おみくじ</title>
</head>
<body>

<header>
    <h1>おみくじ</h1>
</header>

<main>
    <ul>
        <li id="pull">おみくじを引く</li>
    </ul>
    <p id="echo">表示場所</p>
</main>

<footer>フッター</footer>

<script>
$("#pull").on("dblclick",function(){
    const r =Math.ceil(Math.random()*3);
    // const r2 =Math.ceil(Math.random()*2);
    // const r3 =Math.ceil(Math.random()*2);
   
    console.log(r)

    if(r == 1){
        $("#echo").html("⭐大吉⭐");
    }
    if(r == 2){
        $("#echo").html("💧残念💧");
    }
    if(r == 3 ){
        $("#echo").html("そんなこともある");

    }
}); //onは$()に対して、onの中のイベントを実施する




console.log("ここまでは、正しく処理されています")
</script>
</body>
</html>
